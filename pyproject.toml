[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kube-investigator"
version = "0.1.0"
description = "Evidence-backed, read-only multi-agent Kubernetes investigations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "cryptography>=42,<51",
    "httpx>=0.28,<1",
    "mcp>=1.10,<3",
    "opentelemetry-api>=1.30,<2",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
kubernetes = ["kubernetes>=32,<36"]
semantic = ["model2vec>=0.3,<1"]
otel = [
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
trust-eval = [
  "openai-agents>=0.4,<1",
  "openai>=1.60,<3",
]
video = [
  "imageio-ffmpeg>=0.5,<1",
  "pillow>=10,<14",
]

[project.scripts]
kube-investigator = "kube_investigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kube_investigator = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#E9ECF1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14171C"/>
      <stop offset="100%" stop-color="#0C0E12"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1800" height="760" rx="30" fill="url(#card)"/>
  <rect x="1" y="1" width="1798" height="758" rx="29" fill="none" stroke="#242933" stroke-width="2"/>

  <!-- DevOps -->
  <rect x="90" y="96" width="280" height="104" rx="18" fill="#1A1E25" stroke="#3B424E" stroke-width="2"/>
  <text x="230" y="160" text-anchor="middle" font-size="34" font-weight="600" fill="#F4F6F9">DevOps</text>

  <!-- arrow DevOps -> K8s -->
  <line x1="382" y1="148" x2="516" y2="148" stroke="#E9ECF1" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- K8s -->
  <rect x="522" y="96" width="240" height="104" rx="18" fill="#1A1E25" stroke="#3B424E" stroke-width="2"/>
  <text x="642" y="160" text-anchor="middle" font-size="34" font-weight="600" fill="#F4F6F9">K8s</text>

  <!-- branch DevOps -> prompt+MCP+RAG -->
  <polyline points="200,202 200,300 408,300" fill="none" stroke="#E9ECF1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>

  <!-- prompt + MCP + RAG -->
  <rect x="420" y="248" width="520" height="104" rx="18" fill="#1A1E25" stroke="#3B424E" stroke-width="2"/>
  <text x="680" y="312" text-anchor="middle" font-size="32" font-weight="600" fill="#F4F6F9" letter-spacing="0.4">prompt + MCP + RAG</text>

  <!-- arrow down to agent -->
  <line x1="680" y1="356" x2="680" y2="450" stroke="#E9ECF1" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- agent -->
  <rect x="540" y="456" width="280" height="104" rx="18" fill="#1A1E25" stroke="#3B424E" stroke-width="2"/>
  <text x="680" y="520" text-anchor="middle" font-size="34" font-weight="600" fill="#F4F6F9">agent</text>

  <!-- day-1 annotation -->
  <text x="176" y="560" text-anchor="middle" font-size="36" font-weight="500" fill="#8A94A6" letter-spacing="1">day-1</text>
  <g stroke="#39404B" stroke-width="3.4" stroke-linecap="round">
    <line x1="300" y1="618" x2="336" y2="452"/>
    <line x1="330" y1="618" x2="366" y2="452"/>
  </g>

  <!-- arrow agent -> pod -->
  <line x1="824" y1="508" x2="936" y2="508" stroke="#E9ECF1" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- pod / deployment / logs -->
  <rect x="942" y="414" width="336" height="188" rx="18" fill="#1A1E25" stroke="#3B424E" stroke-width="2"/>
  <text x="1110" y="472" text-anchor="middle" font-size="31" font-weight="600" fill="#F4F6F9">Pod</text>
  <text x="1110" y="526" text-anchor="middle" font-size="29" font-weight="500" fill="#C9D0DC">Deployment</text>
  <text x="1110" y="578" text-anchor="middle" font-size="29" font-weight="500" fill="#C9D0DC">Logs</text>

  <!-- arrow pod -> prototype -->
  <line x1="1282" y1="508" x2="1394" y2="508" stroke="#E9ECF1" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- prototype -->
  <rect x="1400" y="456" width="310" height="104" rx="18" fill="#1A1E25" stroke="#3B424E" stroke-width="2"/>
  <text x="1555" y="520" text-anchor="middle" font-size="32" font-weight="600" fill="#F4F6F9" letter-spacing="0.3">Prototype</text>
</svg>

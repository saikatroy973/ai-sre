name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,kubernetes]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: kube-investigator demo --json

  isolation:
    # The OS-isolation gate: build the hardened MCP image and run all five
    # in-container probes, including serving real staged evidence read-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,kubernetes]'
      - run: bash deploy/mcp-container/verify.sh

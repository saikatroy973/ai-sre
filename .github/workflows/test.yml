name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The dedicated `isolation` job below is the authoritative container
    # gate; skip the per-Python rebuild of the same image in the matrix.
    env:
      SKIP_CONTAINER_GATE: "1"
    strategy:
      matrix:
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,kubernetes]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: ai-sre demo --json

  isolation:
    # The OS-isolation gate: build the hardened MCP image and run all five
    # in-container probes, including serving real staged evidence read-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,kubernetes]'
      - run: bash deploy/mcp-container/verify.sh

name: Switch Trust CodeScan

on:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codescan:
    runs-on: ubuntu-latest
    env:
      SWITCH_TRUST_TOKEN: ${{ secrets.SWITCH_TRUST_TOKEN }}
      SWITCH_TRUST_LLM_API_KEY: ${{ secrets.SWITCH_TRUST_LLM_API_KEY }}
    steps:
      - name: Check Switch Trust configuration
        id: configure
        run: |
          if [ -n "$SWITCH_TRUST_TOKEN" ] && [ -n "$SWITCH_TRUST_LLM_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Switch Trust secrets are not configured; CodeScan is skipped, not passed."
          fi
      # Read-only inventory discovery. The action reports findings to Switch Trust.
      # This workflow never converts a skipped scan into a successful gate.
      - name: Run Switch Trust inventory scan
        if: steps.configure.outputs.enabled == 'true'
        uses: sandbox-quantum/switch-trust-codescan-action@7e261a61f4d052c722f0a384c946f571f142dfd1
        with:
          switch_trust_instance: ${{ vars.SWITCH_TRUST_INSTANCE || 'https://app.switchagents.ai' }}
          switch_trust_token: ${{ secrets.SWITCH_TRUST_TOKEN }}
          llm_model: ${{ vars.SWITCH_TRUST_LLM_MODEL || 'anthropic:claude-opus-4-8' }}
          llm_api_key: ${{ secrets.SWITCH_TRUST_LLM_API_KEY }}
      - name: Record that the scan was skipped
        if: steps.configure.outputs.enabled != 'true'
        run: |
          echo "Switch Trust CodeScan was not run. Set SWITCH_TRUST_TOKEN and"
          echo "SWITCH_TRUST_LLM_API_KEY to enable it. This is not a passing scan."
